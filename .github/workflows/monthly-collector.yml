name: Monthly DoT collector

on:
  schedule:
    - cron: '47 3 5 * *' # 09:17 India time, fifth day each month (UTC schedule)
  workflow_dispatch:
    inputs:
      month:
        description: 'Reporting month YYYY-MM; leave blank for previous month'
        required: false
        type: string
      publish:
        description: 'Release passing outputs for Power Automate delivery'
        default: false
        type: boolean
      revision:
        description: 'Use original unless deliberately reissuing a package'
        default: original
        type: string

permissions:
  contents: write

concurrency:
  group: dot-collector-publication
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'
      DOTBO_WORKSPACE: ${{ github.workspace }}/workspace
      TARGET_MONTH: ${{ inputs.month }}
      REVISION: ${{ inputs.revision || 'original' }}
      RELEASE_REQUESTED: ${{ github.event_name == 'schedule' || inputs.publish }}
      DOTBO_DELIVERY_ENABLED: ${{ vars.DOTBO_DELIVERY_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and OCR dependencies
        run: |
          python -m pip install -r requirements-automation.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          tesseract --version
      - name: Collect and check
        shell: bash
        run: |
          args=(--month "$TARGET_MONTH" --output output --revision "$REVISION")
          python -m dotbo.automation "${args[@]}"
      - name: Save outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dot-collector-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Check out private delivery branch
        if: success() && env.RELEASE_REQUESTED == 'true' && env.DOTBO_DELIVERY_ENABLED == 'true'
        uses: actions/checkout@v4
        with:
          ref: automation-output
          path: delivery-branch
          fetch-depth: 1
      - name: Release package for Power Automate
        if: success() && env.RELEASE_REQUESTED == 'true' && env.DOTBO_DELIVERY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          period="$(python -c 'import json; print(json.load(open("output/package.json"))["period"])')"
          target="delivery-branch/delivery/${period}"
          current="delivery-branch/delivery/current"
          rm -rf "$target"
          rm -rf "$current"
          mkdir -p "$target"
          mkdir -p "$current"
          cp output/package.json "$target/ready.json"
          cp output/package.json "$current/ready.json"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("output/package.json").read_text(encoding="utf-8"))
          target = Path("delivery-branch/delivery") / manifest["period"]
          for file in manifest["files"].values():
              source = Path("output") / file["name"]
              if not source.is_file():
                  raise SystemExit(f"Required delivery file is missing: {source}")
              (target / source.name).write_bytes(source.read_bytes())
              (Path("delivery-branch/delivery/current") / source.name).write_bytes(source.read_bytes())
          PY
          cd delivery-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force "delivery/${period}" delivery/current
          if git diff --cached --quiet; then
            echo "No changed package content to release for ${period}."
          else
            git commit -m "Release DoT package ${period}"
            git push origin automation-output
          fi
      - name: Explain skipped release
        if: success() && env.RELEASE_REQUESTED == 'true' && env.DOTBO_DELIVERY_ENABLED != 'true'
        shell: bash
        run: |
          echo 'Package passed validation but was not released. Set DOTBO_DELIVERY_ENABLED=true only after Power Automate has been tested.' >> "$GITHUB_STEP_SUMMARY"
      - name: Show result in Actions
        if: always()
        shell: bash
        run: |
          if [[ -f output/run-summary.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output/run-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No result summary was produced. Inspect the failed setup step.' >> "$GITHUB_STEP_SUMMARY"
          fi
